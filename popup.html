<!DOCTYPE html>
<html lang="en-US">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge" />
		<title>CustomYT Extension</title>
		<script type="text/javascript" src="src/js/jquery-3.7.1.min.js"></script>
		<link rel="stylesheet" type="text/css" href="src/css/build.css" />
		<link rel="stylesheet" type="text/css" href="src/css/style.css" />
	</head>
	<body class="min-w-80 w-full flex items-center justify-center" data-theme="dark">
		<div id="wrapper" class="w-full text-sm">
			<div class="container">
				<header class="flex items-center justify-between px-4 py-2 text-lg font-semibold">
					<h1 id="extension_title" class="text-info">CustomYT Extension</h1>
					<span id="extension_version" class="text-accent">v1.0.0</span>
				</header>
				<div class="divider h-0.5 my-0"></div>
				<main class="flex flex-col gap-y-2 px-4 py-2">
					<div id="info">
						<span>Status:</span>
						<span id="page_status" class="text-warning font-bold">Current tab is in YouTube!</span>
					</div>
					<div id="options">
						<ul class="flex flex-col gap-y-2 font-semibold line-through">
							<li class="form-control">
								<label class="label w-full flex justify-between p-0 cursor-pointer" for="block_ads">
									<span class="label-text">1.&nbsp;&nbsp;Block Ads</span>
									<input type="checkbox" class="toggle toggle-success" name="block_ads" id="block_ads" disabled />
								</label>
							</li>
							<li class="form-control">
								<label class="label w-full flex justify-between p-0 cursor-pointer" for="no_shorts">
									<span class="label-text">2.&nbsp;&nbsp;Disable Shorts</span>
									<input type="checkbox" class="toggle toggle-success" name="no_shorts" id="no_shorts" disabled />
								</label>
							</li>
							<li class="form-control">
								<label class="label w-full flex justify-between p-0 cursor-pointer" for="hide_chat">
									<span class="label-text">3.&nbsp;&nbsp;Hide Live Chat</span>
									<input type="checkbox" class="toggle toggle-success" name="hide_chat" id="hide_chat" disabled />
								</label>
							</li>
							<li class="form-control">
								<label class="label w-full flex justify-between p-0 cursor-pointer" for="custom_loop">
									<span class="label-text">4.&nbsp;&nbsp;Custom Video Loop</span>
									<input type="checkbox" class="toggle toggle-success" name="custom_loop" id="custom_loop" disabled />
								</label>
							</li>
						</ul>
					</div>
				</main>
				<div class="divider h-0.5 my-0"></div>
				<footer class="flex items-center justify-between px-4 py-2">
					<a href="https://github.com/SamGun-Official" class="w-full flex items-center gap-x-3" target="_blank">
						<img src="./src/images/github.png" class="w-9 h-9" alt="GitHub" />
						<div class="flex flex-col text-info leading-snug">
							<span class="text-sm font-semibold">SamGun-Official</span>
							<span class="text-xs">(https://github.com/SamGun-Official)</span>
						</div>
					</a>
				</footer>
			</div>
		</div>
		<script src="src/js/popup.js"></script>
	</body>
</html>
